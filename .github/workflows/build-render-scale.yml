name: Build RenderScale dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'render_scan.m'
      - '.github/workflows/build-render-scale.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          command -v ldid && echo "ldid present" || echo "no ldid"

      - name: Compile RenderScale.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -dynamiclib -O2 -Wno-unused-function \
            -framework UIKit -framework Foundation \
            -o RenderScale.dylib render_scan.m
          file RenderScale.dylib
          lipo -info RenderScale.dylib

      - name: Codesign
        run: |
          if command -v ldid >/dev/null 2>&1; then
            ldid -S RenderScale.dylib
          else
            codesign -f -s - RenderScale.dylib
          fi
          ls -la RenderScale.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderScale.dylib
          path: RenderScale.dylib